name: meridian-works-mes

services:
  mes-app:
    image: meridian-works-mes:latest
    container_name: meridian-mes-app
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=UTC
    volumes:
      # SQLite (gloves_packing.db) needs POSIX locking that Windows bind mounts
      # cannot provide under Docker Desktop (gRPC-FUSE) — a named volume gives
      # a Linux-native filesystem and reliable disk I/O. Data persists across
      # container rebuilds; back it up with:
      #   docker run --rm -v meridian-works-mes_mes-data:/data -v ${PWD}:/backup alpine tar czf /backup/db-backup.tgz -C /data .
      - mes-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mes-data:

